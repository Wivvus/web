<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Golden circle background -->
  <circle cx="50" cy="50" r="48" fill="#F5C518" />

  <!-- W made from two overlapping Vs -->
  <!-- Left V -->
  <polyline
    points="18,28 34,72 50,40"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Right V -->
  <polyline
    points="50,40 66,72 82,28"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
