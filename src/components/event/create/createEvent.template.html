<div class="create-event-page">
  <app-header></app-header>

  <div class="create-content">
    <h1 class="page-title">Create Event</h1>
    <form class="create-form" (ngSubmit)="onSubmit()" ngForm>

      <div class="form-group">
        <label class="form-label" for="name">Event Name</label>
        <input
          class="form-input"
          type="text"
          id="name"
          name="name"
          [(ngModel)]="event.name"
          placeholder="Enter event name"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea
          class="form-input form-textarea"
          id="description"
          name="description"
          [(ngModel)]="event.description"
          placeholder="Describe the event"
          rows="3"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="start_date">Start Date</label>
          <input
            class="form-input"
            type="date"
            id="start_date"
            name="start_date"
            [(ngModel)]="startDate"
            (ngModelChange)="onDateTimeChange()"
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="start_time">Start Time</label>
          <input
            class="form-input"
            type="time"
            id="start_time"
            name="start_time"
            [(ngModel)]="startTime"
            (ngModelChange)="onDateTimeChange()"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="distance_km">Distance (km)</label>
          <input
            class="form-input"
            type="number"
            id="distance_km"
            name="distance_km"
            [(ngModel)]="event.distance_km"
            placeholder="e.g. 5"
            min="0"
            step="0.1"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="pace_min_km">Pace (min/km)</label>
          <input
            class="form-input"
            type="number"
            id="pace_min_km"
            name="pace_min_km"
            [(ngModel)]="event.pace_min_km"
            placeholder="e.g. 5.5"
            min="0"
            step="0.1"
            [disabled]="event.all_paces"
          >
          <label class="checkbox-label">
            <input type="checkbox" name="all_paces" [(ngModel)]="event.all_paces"> All paces welcome
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Location</label>
        <app-map [height]="200" [width]="480" (locationPicked)="onLocationPicked($event)"></app-map>
      </div>

      <div class="form-group">
        <label class="form-label">Sign-up Options <span class="form-label-hint">(optional — adds choices beyond "Join this run")</span></label>
        <div class="options-list">
          <div class="option-row" *ngFor="let opt of optionTexts; let i = index; trackBy: trackByIndex">
            <span class="option-default-badge" *ngIf="i === 0">Default</span>
            <input
              class="form-input option-input"
              type="text"
              [name]="'option_' + i"
              [(ngModel)]="optionTexts[i]"
              placeholder="e.g. 5km, 10km, Half marathon…"
            >
            <button type="button" class="btn-remove-option" (click)="removeOption(i)">✕</button>
          </div>
        </div>
        <p class="options-hint" *ngIf="optionTexts.length > 0">The first option is the default. If an option is removed, attendees are moved to the default.</p>
        <button type="button" class="btn-add-option" (click)="addOption()">+ Add option</button>
      </div>

      <p *ngIf="error" class="form-error">{{ error }}</p>
      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create Event' }}
      </button>
    </form>
  </div>
</div>
