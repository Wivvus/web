<div class="create-event-page">
  <header class="create-header">
    <span class="logo" (click)="goHome()">Wivvus</span>
    <h1>New Event</h1>
  </header>

  <div class="create-content">
    <form class="create-form" (ngSubmit)="onSubmit()" ngForm>

      <div class="form-group">
        <label class="form-label" for="name">Event Name</label>
        <input
          class="form-input"
          type="text"
          id="name"
          name="name"
          [(ngModel)]="event.name"
          placeholder="Enter event name"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea
          class="form-input form-textarea"
          id="description"
          name="description"
          [(ngModel)]="event.description"
          placeholder="Describe the event"
          rows="3"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="start_date">Start Date</label>
          <input
            class="form-input"
            type="date"
            id="start_date"
            name="start_date"
            [(ngModel)]="startDate"
            (ngModelChange)="onDateTimeChange()"
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="start_time">Start Time</label>
          <input
            class="form-input"
            type="time"
            id="start_time"
            name="start_time"
            [(ngModel)]="startTime"
            (ngModelChange)="onDateTimeChange()"
          >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="distance_km">Distance (km)</label>
          <input
            class="form-input"
            type="number"
            id="distance_km"
            name="distance_km"
            [(ngModel)]="event.distance_km"
            placeholder="e.g. 5"
            min="0"
            step="0.1"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="pace_min_km">Pace (min/km)</label>
          <input
            class="form-input"
            type="number"
            id="pace_min_km"
            name="pace_min_km"
            [(ngModel)]="event.pace_min_km"
            placeholder="e.g. 5.5"
            min="0"
            step="0.1"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Location</label>
        <app-map [height]="200" [width]="480" (locationPicked)="onLocationPicked($event)"></app-map>
      </div>

      <button type="submit" class="btn-submit">Create Event</button>
    </form>
  </div>
</div>
