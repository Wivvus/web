<div class="detail-page" *ngIf="event">
  <header class="detail-header">
    <button class="btn-back" (click)="goBack()">&#8592;</button>
    <h1>{{ event.name }}</h1>
    <div class="header-actions" *ngIf="isOwner">
      <button class="btn-edit" (click)="onEdit()">Edit</button>
      <button class="btn-delete" (click)="onDelete()">Delete</button>
    </div>
  </header>

  <div class="detail-map">
    <app-map [height]="280" [readonly]="true" [pin]="pin"></app-map>
  </div>

  <div class="detail-content">

    <div class="detail-stats" *ngIf="event.distance_km || event.pace_min_km || event.start_time">
      <div class="stat" *ngIf="event.start_time">
        <span class="stat-label">When</span>
        <span class="stat-value">{{ event.start_time | date:'medium' }}</span>
      </div>
      <div class="stat" *ngIf="event.distance_km">
        <span class="stat-label">Distance</span>
        <span class="stat-value">{{ event.distance_km }} km</span>
      </div>
      <div class="stat" *ngIf="event.pace_min_km">
        <span class="stat-label">Pace</span>
        <span class="stat-value">{{ event.pace_min_km }} min/km</span>
      </div>
    </div>

    <p class="detail-description" *ngIf="event.description">{{ event.description }}</p>

    <div class="attend-section" *ngIf="isLoggedIn">
      <button class="btn-attend" *ngIf="!isAttending" (click)="onAttend()">Join this run</button>
      <button class="btn-drop" *ngIf="isAttending" (click)="onDrop()">Drop out</button>
    </div>

    <div class="attendees-section" *ngIf="isLoggedIn">
      <h3 class="attendees-title">
        {{ event.attendee_count }} {{ event.attendee_count === 1 ? 'runner' : 'runners' }} attending
      </h3>
      <div class="attendees-list" *ngIf="attendees.length > 0">
        <div class="attendee" *ngFor="let a of attendees">
          <img class="attendee-avatar" [src]="a.avatar_url" [alt]="a.name">
          <span class="attendee-name">{{ a.name }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
