<div class="filters-panel" [class.floating]="floating" [class.collapsed]="collapsed">
  <div class="filters-header" (click)="collapsed = !collapsed">
    <span class="filters-title">
      Filters
      <span *ngIf="hasActiveFilters && collapsed" class="filters-badge">●</span>
    </span>
    <div class="filters-header-actions">
      <button *ngIf="hasActiveFilters && !collapsed" class="btn-clear" (click)="$event.stopPropagation(); clear()">Clear</button>
      <span class="toggle-icon">{{ collapsed ? '﹢' : '﹣' }}</span>
    </div>
  </div>

  <div class="filters-body">

    <div class="filter-group">
      <div class="filter-label-row">
        <label class="filter-label">Run length (km)</label>
        <span class="range-values">{{ lengthLow }} – {{ lengthHigh }}</span>
      </div>
      <div class="dual-range" [style.background]="trackFill(lengthLow, lengthHigh, lengthMin, lengthMax)">
        <input type="range" [(ngModel)]="lengthLow" [min]="lengthMin" [max]="lengthMax" step="1" (input)="onLengthLowChange()">
        <input type="range" [(ngModel)]="lengthHigh" [min]="lengthMin" [max]="lengthMax" step="1" (input)="onLengthHighChange()">
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label-row">
        <label class="filter-label">Pace (min/km)</label>
        <span class="range-values">{{ paceLow }} – {{ paceHigh }}</span>
      </div>
      <div class="dual-range" [style.background]="trackFill(paceLow, paceHigh, paceMin, paceMax)">
        <input type="range" [(ngModel)]="paceLow" [min]="paceMin" [max]="paceMax" step="0.5" (input)="onPaceLowChange()">
        <input type="range" [(ngModel)]="paceHigh" [min]="paceMin" [max]="paceMax" step="0.5" (input)="onPaceHighChange()">
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">From date</label>
      <input class="filter-input" type="date" [(ngModel)]="dateFrom" (change)="apply()">
    </div>


</div>
</div>
