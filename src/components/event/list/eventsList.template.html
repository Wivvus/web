<div class="events-page">
  <app-header></app-header>

  <div class="flash-message" *ngIf="flashMessage">{{ flashMessage }}</div>

  <div class="view-tabs">
    <button class="tab-btn" [class.active]="view === 'list'" (click)="switchView('list')">List</button>
    <button class="tab-btn" [class.active]="view === 'map'" (click)="switchView('map')">Map</button>
  </div>

  @if (view === 'list') {
    <div class="list-layout">
      <aside class="filters-sidebar">
        <event-filters (filtersChange)="onFiltersChange($event)"></event-filters>
      </aside>
      <div class="events-content">
        @for (event of events; track event.id) {
          <eventListView [event]="event"></eventListView>
        } @empty {
          <p class="empty-state">No events yet. Be the first to create one!</p>
        }
        <div class="create-cta" (click)="goToCreate()">
          <p class="cta-text">Can't find the event you want?</p>
          <p class="cta-sub">Click here to make it now — it's free!</p>
        </div>
      </div>
    </div>
  } @else {
    <div class="map-view">
      <div class="map-sidebar">
        <event-filters [floating]="true" (filtersChange)="onFiltersChange($event)"></event-filters>
        <div class="map-create-cta" (click)="goToCreate()">
          <p class="map-cta-text">Can't find the event you want?</p>
          <p class="map-cta-sub">Click here to make it now — it's free!</p>
        </div>
      </div>
      <events-map [filters]="filters"></events-map>
    </div>
  }
</div>
