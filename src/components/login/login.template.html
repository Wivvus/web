<div class="login-container">
  <div class="login-card">
    <div class="login-logo">Wivvus</div>
    <h1>Welcome</h1>
    <p class="login-subtitle">Sign in to continue</p>
    <p *ngIf="message" class="login-message">{{ message }}</p>

    <button class="btn-google" (click)="googleSignIn()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <div class="divider"><span>or</span></div>

    <ng-container *ngIf="!emailLogin">
      <button class="btn-email" (click)="emailLogin = true">Continue with email</button>
    </ng-container>

    <ng-container *ngIf="emailLogin && !forgotMode">
      <p *ngIf="loginError" class="login-message">{{ loginError }}</p>
      <form (ngSubmit)="submitEmailLogin()" class="email-form">
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email" class="email-input" required>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Password" class="email-input" required>
        <button type="submit" class="btn-email-submit" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>
      <p class="forgot-link"><span (click)="forgotMode = true">Forgot password?</span></p>
    </ng-container>

    <ng-container *ngIf="forgotMode">
      <ng-container *ngIf="!forgotSent">
        <p class="login-subtitle">Enter your email and we'll send you a reset link.</p>
        <form (ngSubmit)="submitForgotPassword()" class="email-form">
          <input type="email" [(ngModel)]="forgotEmail" name="forgotEmail" placeholder="Email" class="email-input" required>
          <button type="submit" class="btn-email-submit" [disabled]="loading">
            {{ loading ? 'Sending...' : 'Send reset email' }}
          </button>
        </form>
        <p class="forgot-link"><span (click)="forgotMode = false">Back to sign in</span></p>
      </ng-container>
      <p *ngIf="forgotSent" class="login-message">Check your email for a reset link.</p>
    </ng-container>

    <p class="register-link">Don't have an account? <span (click)="goToRegister()">Sign up</span></p>

    <p class="disclaimer">
      By signing in, you agree to our Terms of Service and Privacy Policy.
    </p>
  </div>
</div>
