<div class="setpass-container">
  <div class="setpass-card">
    <div class="setpass-logo">Wivvus</div>
    <h1>Set your password</h1>
    <p class="setpass-subtitle">Choose a password to complete your account</p>

    <p *ngIf="error" class="setpass-error">{{ error }}</p>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="At least 8 characters"
          class="form-input"
        >
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input
          id="confirm"
          type="password"
          [(ngModel)]="confirm"
          name="confirm"
          required
          placeholder="Repeat your password"
          class="form-input"
        >
      </div>
      <button type="submit" class="btn-submit" [disabled]="loading">
        {{ loading ? 'Setting password...' : 'Create account' }}
      </button>
    </form>
  </div>
</div>
