<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wivvus</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D32F2F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="assets/logo.png?v=2">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Google Sign-In Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <script>
    (function () {
      var isTelegram = typeof window.TelegramWebviewProxy !== 'undefined' ||
                       /\bTelegram\b/i.test(navigator.userAgent);
      var isMobile   = /android|iphone|ipad/i.test(navigator.userAgent);
      if (!isTelegram || !isMobile) return;

      var url       = location.href;
      var isAndroid = /android/i.test(navigator.userAgent);

      var href = isAndroid
        ? 'intent://' + url.replace(/^https?:\/\//, '') +
          '#Intent;scheme=https;action=android.intent.action.VIEW;' +
          'category=android.intent.category.BROWSABLE;end'
        : url;
      var label  = 'Open in your default browser';
      var target = isAndroid ? '' : ' target="_blank" rel="noopener"';

      // Full-page screen — covers app-root so Angular never appears
      var page = document.createElement('div');
      page.style.cssText =
        'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;' +
        'background:#f5f5f5;padding:2rem;box-sizing:border-box;' +
        'font-family:system-ui,sans-serif;text-align:center;';
      page.innerHTML =
        '<img src="/assets/logo.png" alt="Wivvus"' +
          ' style="width:64px;height:64px;border-radius:16px;margin-bottom:1.5rem;">' +
        '<p style="margin:0 0 0.5rem;font-size:1.1rem;font-weight:700;color:#111;">' +
          'Open in your browser</p>' +
        '<p style="margin:0 0 2rem;font-size:0.9rem;color:#666;line-height:1.6;max-width:280px;">' +
          "Wivvus doesn\u2019t work properly inside Telegram\u2019s built-in browser." +
          ' Tap the button below to continue.</p>' +
        '<a href="' + href + '"' + target +
          ' style="display:inline-block;padding:0.8rem 2rem;background:#D32F2F;' +
          'color:#fff;border-radius:8px;font-weight:700;font-size:1rem;' +
          'text-decoration:none;">' + label + '</a>';
      document.body.appendChild(page);
    })();
  </script>

  <app-root></app-root>
</body>
</html>
