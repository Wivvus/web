<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wivvus</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D32F2F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="assets/logo.png?v=2">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Google Sign-In Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <script>
    (function () {
      var isTelegram = typeof window.TelegramWebviewProxy !== 'undefined' ||
                       /\bTelegram\b/i.test(navigator.userAgent);
      var isMobile   = /android|iphone|ipad/i.test(navigator.userAgent);
      if (!isTelegram || !isMobile) return;

      var url = location.href;

      // Programmatic redirects (window.location, window.open) are intercepted by
      // Telegram's WebView on both platforms. A user-initiated tap on a link is
      // the only reliable way to escape — so show a banner with an appropriate href.
      var href, label;
      if (/android/i.test(navigator.userAgent)) {
        // intent:// href: Android routes tapped links to Chrome via the activity system
        href = 'intent://' + url.replace(/^https?:\/\//, '') +
          '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
          encodeURIComponent(url) + ';end';
        label = 'Open in Chrome';
      } else {
        // iOS: tapped _blank links escape Telegram's WKWebView to Safari
        href = url;
        label = 'Open in Safari';
      }

      var banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;' +
        'display:flex;align-items:center;justify-content:space-between;' +
        'background:#111;color:#fff;padding:0.85rem 1rem;' +
        'font-family:system-ui,sans-serif;font-size:0.9rem;gap:1rem;';
      var target = /android/i.test(navigator.userAgent) ? '' : ' target="_blank" rel="noopener"';
      banner.innerHTML =
        '<span>Open in your browser for the best experience</span>' +
        '<a href="' + href + '"' + target +
          ' style="flex-shrink:0;padding:0.45rem 0.9rem;background:#D32F2F;' +
          'color:#fff;border-radius:6px;font-weight:700;font-size:0.85rem;' +
          'text-decoration:none;">' + label + '</a>';
      document.body.appendChild(banner);
    })();
  </script>

  <app-root></app-root>
</body>
</html>
